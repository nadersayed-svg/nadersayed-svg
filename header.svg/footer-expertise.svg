    <g opacity="0.9" filter="url(#shadow)">
      <g transform="translate(40 110)"><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -16;0 0" dur="6s" repeatCount="indefinite"/><use xlink:href="#cube" transform="scale(1.5)"/></g></g>
      <g transform="translate(1150 90)"><g><animateTransform attributeName="transform" type="translate" values="0 0;0 14;0 0" dur="7s" repeatCount="indefinite"/><use xlink:href="#cube" transform="scale(1.3)"/></g></g>
      <g transform="translate(1160 470)" opacity="0.8"><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -12;0 0" dur="5s" repeatCount="indefinite"/><use xlink:href="#cube" transform="scale(1.7)"/></g></g>
      <g transform="translate(35 500)" opacity="0.8"><g><animateTransform attributeName="transform" type="translate" values="0 0;0 12;0 0" dur="8s" repeatCount="indefinite"/><use xlink:href="#cube" transform="scale(1.1)"/></g></g>
      <g transform="translate(30 330)" opacity="0.5"><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="9s" repeatCount="indefinite"/><use xlink:href="#cube" transform="scale(0.7)"/></g></g>
      <g transform="translate(1170 290)" opacity="0.5"><g><animateTransform attributeName="transform" type="translate" values="0 0;0 10;0 0" dur="7.5s" repeatCount="indefinite"/><use xlink:href="#cube" transform="scale(0.7)"/></g></g>
    </g>

    <!-- particles -->
    <g fill="#ffffff">
      <circle cx="240" cy="50" r="2"><animate attributeName="opacity" values="0.1;1;0.1" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="450" cy="28" r="1.6"><animate attributeName="opacity" values="1;0.1;1" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="800" cy="46" r="2"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.5s" repeatCount="indefinite"/></circle>
      <circle cx="980" cy="26" r="1.6"><animate attributeName="opacity" values="1;0.2;1" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="300" cy="610" r="1.8"><animate attributeName="opacity" values="0.1;1;0.1" dur="4.5s" repeatCount="indefinite"/></circle>
      <circle cx="920" cy="628" r="1.8"><animate attributeName="opacity" values="1;0.1;1" dur="3.8s" repeatCount="indefinite"/></circle>
    </g>

    <!-- heading -->
    <g text-anchor="middle">
      <text x="600" y="78" font-size="40" font-weight="800" fill="url(#brand)" letter-spacing="0.5">Areas of Expertise</text>
      <rect x="540" y="92" width="120" height="4" rx="2" fill="url(#brand)">
        <animate attributeName="width" values="40;120;40" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="x" values="580;540;580" dur="4s" repeatCount="indefinite"/>
