      <circle r="42" fill="none" stroke="url(#brand)" stroke-width="2" stroke-dasharray="10 14" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
      </circle>
    </g>
