<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 800" width="100%" role="img" aria-labelledby="t d">
  <title id="t">Areas of Expertise - Nader Sayed, Data Analyst</title>
  <desc id="d">Animated footer showing expertise in data analysis, Excel and data cleaning, SQL and databases, Power BI and DAX, Python and C++, and networking (CCNA), with a thank-you note and animated waves.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1026"/><stop offset="0.55" stop-color="#151a3d"/><stop offset="1" stop-color="#0a1a33"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/><stop offset="0.5" stop-color="#8b9cff"/><stop offset="1" stop-color="#c084fc"/>
      <animate attributeName="x1" values="0;1;0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="cTop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a5b4fc"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
    <linearGradient id="cLeft" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#3730a3"/></linearGradient>
    <linearGradient id="cRight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#0e7490"/></linearGradient>
    <linearGradient id="w1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#60a5fa" stop-opacity="0.55"/><stop offset="0.5" stop-color="#c084fc" stop-opacity="0.55"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0.55"/></linearGradient>
    <linearGradient id="w2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#818cf8" stop-opacity="0.5"/><stop offset="1" stop-color="#5eead4" stop-opacity="0.5"/></linearGradient>
    <linearGradient id="w3" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6366f1" stop-opacity="0.9"/><stop offset="0.5" stop-color="#a78bfa" stop-opacity="0.9"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0.9"/></linearGradient>
    <radialGradient id="glowA" cx="0.15" cy="0.08" r="0.6"><stop offset="0" stop-color="#6366f1" stop-opacity="0.35"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB" cx="0.88" cy="0.4" r="0.5"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.26"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/></filter>
    <clipPath id="frame"><rect width="1200" height="800" rx="24"/></clipPath>
    <g id="cube">
      <polygon points="0,-20 20,-10 0,0 -20,-10" fill="url(#cTop)"/>
      <polygon points="-20,-10 0,0 0,24 -20,14" fill="url(#cLeft)"/>
      <polygon points="20,-10 0,0 0,24 20,14" fill="url(#cRight)"/>
    </g>
    <path id="wave" d="M0 40 q150 -40 300 0 t300 0 t300 0 t300 0 t300 0 t300 0 t300 0 t300 0 V200 H0 Z"/>
    <!-- icon badge ring -->
    <g id="badge">
